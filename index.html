<!doctype html>
<html lang="en" class="is-locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>#RViShCameTrue · Shrinav weds Vidushi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Shrinav weds Vidushi · Saturday, 12th December 2026 · Ghaziabad">
<meta name="theme-color" content="#F6EFE2">
<meta property="og:type" content="website">
<meta property="og:title" content="#RViShCameTrue · Shrinav weds Vidushi">
<meta property="og:description" content="Saturday, 12th December 2026 · Ghaziabad">
<meta property="og:image" content="https://rvishcametrue.us/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/art/monogram.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/toon.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#A8742A"/>
      <stop offset=".38" stop-color="#E9C77B"/>
      <stop offset=".5" stop-color="#FFF0C8"/>
      <stop offset=".62" stop-color="#D9A748"/>
      <stop offset="1" stop-color="#94621F"/>
    </linearGradient>
  </defs>
</svg>

<div class="sky" aria-hidden="true"><div class="stars"></div><div class="stars stars-b"></div><div class="horizon"></div></div>
<div class="grain" aria-hidden="true"></div>

<!-- 1. while everything loads -->
<div class="preload" id="preload" role="status" aria-label="Loading the invitation">
  <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
    <circle class="ring-bg" cx="60" cy="60" r="54"/>
    <circle class="ring-fg" id="ring" cx="60" cy="60" r="54" pathLength="1"/>
  </svg>
  <span class="om" lang="sa">ॐ</span>
</div>

<!-- 2. the envelope, tied with a mauli thread -->
<div class="gate" id="gate" hidden>
  <div class="env">
    <div class="env-body">
      <div class="env-back"></div>
      <div class="env-fold env-left"></div>
      <div class="env-fold env-right"></div>
      <div class="env-fold env-bottom"></div>
    </div>
    <div class="env-flap">
      <div class="env-address">
        <span class="to">To,</span>
        <span class="guest" id="guest">our dear family &amp; friends</span>
      </div>
    </div>
    <div class="thread th-l"></div>
    <div class="thread th-r"></div>
    <svg class="knot" viewBox="0 0 120 120" aria-hidden="true">
      <path class="tail" d="M60 60 C52 76 44 88 34 104"/>
      <path class="tail" d="M60 60 C68 76 76 88 86 104"/>
      <circle class="tassel" cx="34" cy="106" r="5"/><circle class="tassel" cx="86" cy="106" r="5"/>
      <path class="loop" d="M60 60 C46 40 22 44 26 58 C30 72 50 66 60 60 Z"/>
      <path class="loop" d="M60 60 C74 40 98 44 94 58 C90 72 70 66 60 60 Z"/>
      <circle class="knot-c" cx="60" cy="60" r="8"/>
    </svg>
    <button class="open-hit" id="open" type="button" aria-label="Open the invitation"></button>
    <p class="env-hint" id="hint">Tap to open</p>
  </div>
</div>

<canvas class="dust" id="dust" aria-hidden="true"></canvas>

<!-- the two of them, above everything until they jump into the hashtag -->
<div class="cast" id="cast" aria-hidden="true">
  <div class="halo" id="halo"></div>
  <div class="actor a-groom" id="a-groom" data-toon="groom"></div>
  <div class="actor a-bride" id="a-bride" data-toon="bride"></div>
</div>

<main id="main">

  <section class="hero" id="hero" data-sky="paper">
    <div class="veil" id="veil" aria-hidden="true"></div>
    <div class="balloons" id="balloons" aria-hidden="true"></div>
    <div class="bell bell-l"><div class="bell-art"></div></div>
    <div class="bell bell-r"><div class="bell-art"></div></div>
    <div class="hero-inner">
      <h1 class="tag" aria-label="#RViShCameTrue">
        <span class="tag-1" aria-hidden="true"><span class="tg tg-hash">#</span><span class="tg tg-r">R</span><span class="tg tg-vi tg-fill" id="tg-vi" data-text="Vi">Vi</span><span class="tg tg-sh tg-fill" id="tg-sh" data-text="Sh">Sh</span></span>
        <span class="tag-2 tg" aria-hidden="true">CameTrue</span>
      </h1>
      <p class="names-text">Shrinav weds Vidushi</p>
      <p class="hero-date" aria-label="12 December 2026"><span>12</span><i></i><span>12</span><i></i><span>2026</span></p>
      <p class="hero-place">Ghaziabad</p>
    </div>
    <p class="cue" aria-hidden="true"><span>Scroll</span><i></i></p>
  </section>

  <section class="blessing" id="blessing" data-sky="paper">
    <div class="art draw ganesha" data-svg="ganesha"></div>
    <p class="shloka" lang="sa">
      <span class="ln">॥ श्री गणेशाय नमः ॥</span>
      <span class="ln">वक्रतुण्ड महाकाय, सूर्यकोटि समप्रभः ।</span>
      <span class="ln">निर्विघ्नं कुरु मे देव, सर्वकार्येषु सर्वदा ॥</span>
    </p>
    <div class="orn divider" aria-hidden="true"></div>
  </section>

  <section class="invite" id="invite" data-sky="paper">
    <div class="frame">
      <div class="orn corner c-tl" aria-hidden="true"></div>
      <div class="orn corner c-tr" aria-hidden="true"></div>
      <div class="orn corner c-bl" aria-hidden="true"></div>
      <div class="orn corner c-br" aria-hidden="true"></div>
      <div class="frame-copy">
        <p class="hosts" data-reveal data-bind="hosts"></p>
        <p class="req" data-reveal data-bind="request"></p>
        <h2 class="name" data-split data-bind="firstName"></h2>
        <p class="parent" data-reveal data-bind="firstParents"></p>
        <p class="with" data-reveal>with</p>
        <h2 class="name" data-split data-bind="secondName"></h2>
        <p class="parent" data-reveal data-bind="secondParents"></p>
      </div>
    </div>
  </section>

  <div id="events"></div>

  <section class="couple" id="couple">
    <figure class="portrait">
      <div class="arch"><img id="couple-photo" alt="Shrinav and Vidushi" decoding="async"></div>
      <figcaption><span class="who">Shrinav <i>&amp;</i> Vidushi</span></figcaption>
    </figure>
  </section>

  <section class="moments" id="moments">
    <div class="stage">
      <h2 class="moments-title">Before the pheras</h2>
      <div class="deck" id="deck"></div>
    </div>
  </section>

  <footer class="closing" id="closing">
    <div class="orn ornament" aria-hidden="true"></div>
    <p class="compl" data-reveal>Best compliments</p>
    <p class="family" data-reveal data-bind="family"></p>
    <p class="closing-tag" data-reveal>#RViShCameTrue</p>
  </footer>

</main>

<template id="event-tpl">
  <section class="event">
    <i class="ev-corner k1" aria-hidden="true"></i><i class="ev-corner k2" aria-hidden="true"></i>
    <i class="ev-corner k3" aria-hidden="true"></i><i class="ev-corner k4" aria-hidden="true"></i>
    <div class="ev-tag" aria-hidden="true">#RViShCameTrue</div>
    <p class="doha" lang="hi" hidden>
      <span class="ln">॥ श्री गणेशाय नमः ॥</span>
      <span class="ln">विघ्न हरण मंगल करन, गणनायक महाराज ।</span>
      <span class="ln">प्रथम निमंत्रण आपको, पूरण करियो काज ॥</span>
    </p>
    <h2 class="sr-only ev-heading"></h2>
    <div class="ev-title" aria-hidden="true"></div>
    <div class="details">
      <div class="block" data-reveal>
        <p class="label">When</p>
        <p class="big ev-date"></p>
        <p class="ev-time"></p>
      </div>
      <div class="orn divider small" aria-hidden="true"></div>
      <div class="block" data-reveal>
        <p class="label">Where</p>
        <p class="big ev-venue"></p>
        <p class="ev-venue-line"></p>
      </div>
    </div>
    <div class="actions" data-reveal>
      <a class="btn ev-maps" target="_blank" rel="noopener">Get directions</a>
      <button class="btn ghost ev-cal" type="button">Add to calendar</button>
    </div>
    <div class="countdown" hidden>
      <p class="label">Counting down to the wedding</p>
      <div class="clock" role="timer" aria-live="off">
        <div><b data-u="d">00</b><span>Days</span></div>
        <div><b data-u="h">00</b><span>Hours</span></div>
        <div><b data-u="m">00</b><span>Minutes</span></div>
        <div><b data-u="s">00</b><span>Seconds</span></div>
      </div>
    </div>
  </section>
</template>

<button class="music" id="music" type="button" aria-label="Pause music" aria-pressed="true" hidden>
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="/main.js"></script>
</body>
</html>
