<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrinav & Vidushi · character mock</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2B1A12; --bg: #F6B81F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1d140c; overflow: hidden; }
  .fit { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1350px; transform: translate(-50%, -50%); }

  /* fixed 4:5 stage, scaled to fit any screen */
  .stage {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 45%, #FFCB3D 0%, var(--bg) 55%, #EBA70F 100%);
    font-family: "Anton", Impact, sans-serif;
  }

  .word { position: absolute; color: #fff; opacity: .55; font-size: 44px; letter-spacing: .02em; }
  .title {
    position: absolute; left: 0; right: 0; top: 320px; text-align: center; line-height: .86;
    font-size: 218px; letter-spacing: -.005em;
  }
  .title span { display: block; }
  .t1 { color: #17110C; }
  .t2 { color: #fff; }

  .char { position: absolute; bottom: 80px; width: 390px; height: 780px; overflow: visible; }
  .boy { left: -34px; }
  .girl { right: -34px; }
  .shadow { position: absolute; bottom: 66px; width: 280px; height: 44px; border-radius: 50%; background: rgba(120, 70, 0, .28); filter: blur(4px); }
  .sh-boy { left: 22px; } .sh-girl { right: 22px; }

  .char path, .char rect, .char circle, .char ellipse { stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .nostroke { stroke: none !important; }
  .char pattern * { stroke: none !important; }
  .skin { fill: #E9B58E; } .skin2 { fill: #EDBE98; }
  .hair { fill: #2A1B14; }
  .beard { fill: #3B2A20; }
  .white { fill: #fff; } .pupil { fill: #2B1A12; stroke: none !important; } .shine { fill: #fff; stroke: none !important; }
  .kurta { fill: #F2EADA; } .pant { fill: #FBF8F2; }
  .jacket { fill: url(#floral); }
  .gold { fill: #D9A948; }
  .rust { fill: url(#bandhani); }
  .legging { fill: #F4E7CF; }
  .jutti-b { fill: #6B3A1F; } .jutti-g { fill: #D9A948; }
  .mouth { fill: #7A2B21; } .teeth { fill: #fff; stroke-width: 0 !important; }
  .blush { fill: #E9876F; opacity: .45; stroke: none !important; }
  .line { fill: none; }
  .glass { fill: rgba(255, 255, 255, .22); stroke: #4A3B33 !important; stroke-width: 2.6 !important; }
  .goldline { fill: none; stroke: #D9A948 !important; }

  .heart { position: absolute; left: 50%; top: 190px; width: 120px; margin-left: -60px; opacity: 0; }

  .replay {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 600 22px/1 system-ui, sans-serif; letter-spacing: .04em; color: #17110C;
    background: rgba(255,255,255,.65); border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const stage = document.getElementById("stage"), box = document.getElementById("fit");
  const fit = () => {
    const s = Math.min(innerWidth / 1080, innerHeight / 1350);
    box.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener("resize", fit);

  // pivot points in each character's 200x400 drawing space
  const PIV = { legL: "88 290", legR: "112 290", armL: "64 182", armR: "136 182", head: "100 150", body: "100 300", rig: "100 390" };
  const part = (c, name) => c.querySelector("." + name);

  function walkCycle(c, dir) {
    const tl = gsap.timeline({ repeat: -1, defaults: { ease: "sine.inOut", duration: 0.26 } });
    const L = part(c, "legL"), R = part(c, "legR"), aL = part(c, "armL"), aR = part(c, "armR");
    const rig = part(c, "rig"), head = part(c, "head"), hem = part(c, "hem");
    gsap.set([L, R], { svgOrigin: (i) => (i ? PIV.legR : PIV.legL) });
    gsap.set(aL, { svgOrigin: PIV.armL }); gsap.set(aR, { svgOrigin: PIV.armR });
    gsap.set(head, { svgOrigin: PIV.head }); gsap.set(hem, { svgOrigin: PIV.body });
    // step one: left leg lifts forward, right arm swings
    tl.to(L, { rotation: 16 * dir, y: -9 }, 0).to(R, { rotation: -8 * dir, y: 0 }, 0)
      .to(aL, { rotation: -18 * dir }, 0).to(aR, { rotation: -18 * dir }, 0)
      .to(rig, { y: -8 }, 0).to(head, { rotation: 3 * dir }, 0).to(hem, { skewX: -3 * dir }, 0)
    // step two: mirror
      .to(L, { rotation: -8 * dir, y: 0 }, 0.26).to(R, { rotation: 16 * dir, y: -9 }, 0.26)
      .to(aL, { rotation: 18 * dir }, 0.26).to(aR, { rotation: 18 * dir }, 0.26)
      .to(rig, { y: 0 }, 0.26).to(head, { rotation: -3 * dir }, 0.26).to(hem, { skewX: 3 * dir }, 0.26);
    return tl;
  }

  function settle(c) {
    const parts = ["legL", "legR", "armL", "armR", "head", "hem"].map((n) => part(c, n));
    return gsap.timeline()
      .to(parts, { rotation: 0, y: 0, skewX: 0, duration: 0.3, ease: "power2.out" }, 0)
      .to(part(c, "rig"), { y: 0, scaleY: 0.94, scaleX: 1.04, svgOrigin: PIV.rig, duration: 0.12, ease: "power2.out" }, 0)
      .to(part(c, "rig"), { scaleY: 1, scaleX: 1, duration: 0.5, ease: "elastic.out(1.2, 0.4)" }, 0.12);
  }

  function blink(c, at, tl) {
    tl.to(part(c, "eyes"), { scaleY: 0.1, svgOrigin: "100 106", duration: 0.07, yoyo: true, repeat: 1, ease: "none" }, at);
  }

  let master;
  function play() {
    gsap.globalTimeline.getChildren().forEach((t) => t.kill());
    const boy = document.getElementById("boy"), girl = document.getElementById("girl");
    const words = gsap.utils.toArray(".word");
    gsap.set([boy, girl, "#sh-boy", "#sh-girl", ".t1", ".t2", "#heart", stage], { clearProps: "transform,opacity,visibility,filter" });
    [boy, girl].forEach((c) => c.querySelectorAll("g").forEach((g) => gsap.set(g, { clearProps: "transform" })));

    const OFF = 760;
    gsap.set([boy, "#sh-boy"], { x: -OFF });
    gsap.set([girl, "#sh-girl"], { x: OFF });
    gsap.set([".t1", ".t2"], { autoAlpha: 0 });
    gsap.set(words, { autoAlpha: 0, y: 20 });

    const walkB = walkCycle(boy, 1), walkG = walkCycle(girl, -1);
    master = gsap.timeline();
    master
      .to(words, { autoAlpha: 0.55, y: 0, duration: 0.8, stagger: 0.08, ease: "power2.out" }, 0)
      // both stroll in from the edges
      .to([boy, "#sh-boy"], { x: 0, duration: 2.6, ease: "power1.out" }, 0.2)
      .to([girl, "#sh-girl"], { x: 0, duration: 2.6, ease: "power1.out" }, 0.45)
      .call(() => { walkB.kill(); settle(boy); }, null, 2.8)
      .call(() => { walkG.kill(); settle(girl); }, null, 3.05)
      // names slam in behind them
      .fromTo(".t1", { autoAlpha: 0, scale: 1.5, filter: "blur(8px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "back.out(2)" }, 3.2)
      .fromTo(".t2", { autoAlpha: 0, scale: 1.5, filter: "blur(8px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "back.out(2)" }, 3.45)
      .to(stage, { x: 6, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, 3.45)
      // they look at each other
      .to(part(boy, "pupils"), { x: 4, duration: 0.25 }, 4.0)
      .to(part(girl, "pupils"), { x: -4, duration: 0.25 }, 4.0)
      .to(part(boy, "head"), { rotation: 7, svgOrigin: PIV.head, duration: 0.4, ease: "power2.out" }, 4.0)
      .to(part(girl, "head"), { rotation: -7, svgOrigin: PIV.head, duration: 0.4, ease: "power2.out" }, 4.05)
      // he waves, she does a little twirl
      .to(part(boy, "armR"), { rotation: -150, svgOrigin: PIV.armR, duration: 0.35, ease: "back.out(1.6)" }, 4.5)
      .to(part(boy, "armR"), { rotation: -125, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, 4.85)
      .to(part(boy, "armR"), { rotation: 0, duration: 0.4, ease: "power2.inOut" }, 5.95)
      .to(part(girl, "rig"), { scaleX: -1, svgOrigin: PIV.rig, duration: 0.22, ease: "power1.in" }, 4.6)
      .to(part(girl, "rig"), { scaleX: 1, duration: 0.22, ease: "power1.out" }, 4.82)
      .to(part(girl, "rig"), { y: -16, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 4.6)
      .to(part(girl, "hairback"), { scaleY: 1.06, svgOrigin: "100 60", duration: 0.12, yoyo: true, repeat: 3 }, 4.95)
      // heart pops between them
      .to(part(boy, "pupils"), { x: 0, duration: 0.25 }, 6.1)
      .to(part(girl, "pupils"), { x: 0, duration: 0.25 }, 6.1)
      .to([part(boy, "head"), part(girl, "head")], { rotation: 0, duration: 0.4 }, 6.1)
      .fromTo("#heart", { autoAlpha: 0, scale: 0.2, y: 40 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(3)" }, 6.3)
      .to("#heart", { scale: 1.12, duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 6.8);
    blink(boy, 3.7, master); blink(girl, 3.9, master); blink(boy, 6.6, master); blink(girl, 7.2, master);

    // idle breathing after the beat
    [boy, girl].forEach((c, i) => master.to(part(c, "body"), { scaleY: 1.015, svgOrigin: PIV.body, duration: 1.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 6.2 + i * 0.3));
  }

  document.getElementById("replay").addEventListener("click", play);
  document.fonts.ready.then(play);
})();
</script>
