<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event palettes · #RViShcametrue</title>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    /* real foil: dark base, warm gold, two bright light bands, back to antique */
    --foil: linear-gradient(100deg, #7A5A1E 0%, #BF953F 16%, #FCF6BA 32%, #B38728 48%, #FBF5B7 64%, #AA771C 82%, #7A5A1E 100%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0E0C0B; color: #EDE6DA; font-family: Calibri, "Carlito", system-ui, sans-serif; }
  header { padding: 30px 16px 6px; text-align: center; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: .02em; }
  header p { margin: 8px auto 0; max-width: 680px; color: #A79E91; }

  .event { max-width: 1180px; margin: 0 auto; padding: 26px 16px 8px; }
  .event > h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
  .event > p { margin: 0 0 16px; color: #A79E91; }
  .pair { display: grid; gap: 34px; grid-template-columns: repeat(auto-fit, minmax(300px, 360px)); justify-content: center; }

  .opt h3 { margin: 0 0 10px; font-size: 18px; }
  .opt h3 span { display: inline-block; min-width: 34px; padding: 2px 8px; margin-right: 8px; border-radius: 6px; background: var(--foil); color: #1A1206; font-size: 14px; text-align: center; }

  /* the card preview */
  .phone {
    position: relative; aspect-ratio: 9 / 15; border-radius: 18px; overflow: hidden; isolation: isolate;
    background: radial-gradient(120% 80% at 50% 35%, var(--bg2), var(--bg1) 70%);
    color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .phone::before { /* jaali texture in the metal's colour */
    content: ""; position: absolute; inset: 0; z-index: -1; opacity: var(--tex, .1);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><g fill='none' stroke='%23E8C77A' stroke-width='.8'><path d='M22 2 L42 22 L22 42 L2 22 Z'/><circle cx='22' cy='22' r='6'/><path d='M22 16 C26 19 26 25 22 28 C18 25 18 19 22 16 Z'/></g></svg>");
  }
  .phone::after { /* fine double rule, inset like a printed card */
    content: ""; position: absolute; inset: 12px; z-index: -1; border-radius: 10px;
    border: 1px solid var(--rule); box-shadow: inset 0 0 0 5px transparent, inset 0 0 0 6px var(--rule);
  }
  .corner { position: absolute; width: 58px; height: 74px; background: var(--foil); -webkit-mask: url("/assets/art/corner.svg") center / contain no-repeat; mask: url("/assets/art/corner.svg") center / contain no-repeat; }
  .c1 { top: 20px; left: 20px; } .c2 { top: 20px; right: 20px; transform: scaleX(-1); }
  .c3 { bottom: 20px; left: 20px; transform: scaleY(-1); } .c4 { bottom: 20px; right: 20px; transform: scale(-1, -1); }

  .foil-text { background: var(--foil); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 4s ease-in-out infinite alternate; }
  @keyframes shine { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  .tag { font-weight: 700; font-size: 18px; letter-spacing: .04em; }
  .title { margin-top: 14px; font-weight: 700; font-size: clamp(30px, 8.6vw, 40px); line-height: 1.05; }
  .label { margin-top: 18px; font-size: 11px; letter-spacing: .34em; color: var(--accent); }
  .big { margin-top: 4px; font-weight: 700; font-size: 18px; }
  .soft { color: var(--soft); font-size: 15px; }
  .divider { width: 150px; height: 14px; margin: 16px auto 0; background: var(--foil); -webkit-mask: url("/assets/art/divider.svg") center / contain no-repeat; mask: url("/assets/art/divider.svg") center / contain no-repeat; }
  .btns { display: flex; gap: 8px; margin-top: 22px; }
  .btn { padding: 10px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .14em; }
  .btn.solid { background: var(--foil); color: #1A1206; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .btn.ghost { border: 1px solid #C9A24A; color: #F3DE9C; }
  .light .btn.ghost { color: #5A3604; border-color: #8A5A10; }
  .light .btn.solid { color: #FFF4D6; }
  /* on yellow and ivory grounds bright gold vanishes, so the metal turns to deep bronze foil */
  .light { --foil: linear-gradient(100deg, #3A2203 0%, #7A4A08 18%, #C9902A 34%, #6E4006 50%, #B87F1E 66%, #4A2C04 84%, #3A2203 100%); }

  .sw { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; font-size: 12px; color: #A79E91; }
  .sw i { display: block; height: 30px; border-radius: 6px; margin-bottom: 4px; border: 1px solid rgba(255,255,255,.08); }
  .sw b { display: block; color: #EDE6DA; font-weight: 700; }
  .note { margin-top: 8px; color: #A79E91; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Palettes by event</h1>
  <p>One look per event, all sharing the same real gold foil. Wedding leans red, Engagement green, Haldi yellow. Pick one letter per event (for example W1, E2, H1).</p>
</header>

<script>
const EVENTS = [
  { name: "Wedding", hint: "A tint of red: deep, velvety reds with foil gold. 8 pm, so it should feel like evening.", title: "Wedding Ceremony",
    date: "Saturday, 12th December 2026", time: "8 pm onwards", venue: "Royal Heritage", where: "Country Inn & Suites, Ghaziabad",
    opts: [
      { id: "W1", name: "Sindoor Velvet", note: "Oxblood to crimson velvet. The classic maroon-and-gold, made richer and darker so the foil glows.",
        bg1: "#2B0408", bg2: "#7A0E1C", ink: "#FFF4E2", soft: "#E9C9B9", accent: "#F1C76A", rule: "rgba(232,199,122,.55)",
        sw: [["Oxblood", "#2B0408"], ["Crimson velvet", "#7A0E1C"], ["Foil gold", "#D4A845"], ["Ivory", "#FFF4E2"], ["Rose blush", "#E9C9B9"]] },
      { id: "W2", name: "Black Ruby", note: "Near-black with ruby light. The highest-contrast option: gold reads brightest on it.",
        bg1: "#0A0405", bg2: "#5A0A16", ink: "#FFF6EA", soft: "#D9B8AE", accent: "#F1C76A", rule: "rgba(232,199,122,.5)",
        sw: [["Onyx", "#0A0405"], ["Ruby", "#9B111E"], ["Foil gold", "#D4A845"], ["Ivory", "#FFF6EA"], ["Garnet glow", "#5A0A16"]] },
    ] },
  { name: "Engagement", hint: "A tint of green: emerald and bottle green with gold, the 2026 jewel-tone favourite.", title: "Engagement Ceremony",
    date: "Date to be announced", time: "", venue: "Venue to be announced", where: "",
    opts: [
      { id: "E1", name: "Emerald Velvet", note: "Deep emerald with a jade glow. Pairs naturally with the gold foil and the red wedding.",
        bg1: "#021F18", bg2: "#0A6049", ink: "#F3F8F2", soft: "#BFD8CC", accent: "#F1C76A", rule: "rgba(232,199,122,.5)",
        sw: [["Deep emerald", "#021F18"], ["Emerald", "#0A6049"], ["Foil gold", "#D4A845"], ["Pearl", "#F3F8F2"], ["Jade", "#4FA585"]] },
      { id: "E2", name: "Bottle Green & Champagne", note: "Darker and quieter. More old-money, with champagne text instead of white.",
        bg1: "#06130E", bg2: "#1D4433", ink: "#F6EBD3", soft: "#C9C2A6", accent: "#E9C77B", rule: "rgba(233,199,123,.45)",
        sw: [["Bottle green", "#06130E"], ["Forest", "#1D4433"], ["Foil gold", "#D4A845"], ["Champagne", "#F6EBD3"], ["Sage", "#9DB09A"]] },
    ] },
  { name: "Haldi", hint: "A tint of yellow: turmeric and marigold, daytime and bright, but still with depth.", title: "Haldi Ceremony",
    date: "Date to be announced", time: "", venue: "Venue to be announced", where: "",
    opts: [
      { id: "H1", name: "Turmeric Sun", note: "Saturated turmeric to marigold with deep chocolate text. Bold and festive, high contrast.", light: true,
        bg1: "#E08A00", bg2: "#FFCB3D", ink: "#2A1200", soft: "#5A3200", accent: "#5A2C00", rule: "rgba(90,44,0,.45)", tex: .14,
        sw: [["Marigold", "#E08A00"], ["Turmeric", "#FFCB3D"], ["Foil gold", "#D4A845"], ["Chocolate", "#2A1200"], ["Saffron", "#F26B0F"]] },
      { id: "H2", name: "Marigold on Ivory", note: "Ivory paper glowing into marigold at the edges, bronze foil, saffron accents. Softer, daytime luxury.", light: true,
        bg1: "#F9C34A", bg2: "#FFF9EA", ink: "#3A1C00", soft: "#6E4410", accent: "#C2410C", rule: "rgba(138,90,16,.45)", tex: .12,
        sw: [["Ivory", "#FFF9EA"], ["Marigold", "#F9C34A"], ["Bronze foil", "#9A6512"], ["Saffron", "#C2410C"], ["Cocoa", "#3A1C00"]] },
    ] },
];

document.body.insertAdjacentHTML("beforeend", EVENTS.map((ev) => `
  <section class="event">
    <h2>${ev.name}</h2><p>${ev.hint}</p>
    <div class="pair">${ev.opts.map((o) => `
      <div class="opt">
        <h3><span>${o.id}</span>${o.name}</h3>
        <div class="phone ${o.light ? "light" : ""}" style="--bg1:${o.bg1};--bg2:${o.bg2};--ink:${o.ink};--soft:${o.soft};--accent:${o.accent};--rule:${o.rule};${o.tex ? `--tex:${o.tex}` : ""}">
          <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
          <div class="tag foil-text">#RViShcametrue</div>
          <div class="title foil-text">${ev.title}</div>
          <div class="label">WHEN</div><div class="big">${ev.date}</div>${ev.time ? `<div class="soft">${ev.time}</div>` : ""}
          <div class="divider"></div>
          <div class="label">WHERE</div><div class="big">${ev.venue}</div>${ev.where ? `<div class="soft">${ev.where}</div>` : ""}
          <div class="btns"><span class="btn solid">GET DIRECTIONS</span><span class="btn ghost">ADD TO CALENDAR</span></div>
        </div>
        <div class="sw">${o.sw.map(([n, h]) => `<div><i style="background:${h}"></i><b>${n}</b>${h}</div>`).join("")}</div>
        <p class="note">${o.note}</p>
      </div>`).join("")}
    </div>
  </section>`).join(""));
</script>
</body>
</html>
